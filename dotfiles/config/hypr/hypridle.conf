# =====================================================================
#  hypridle.conf — idle behaviour for this laptop
#
#  Started from ~/.config/hypr/hyprland.lua (AUTOSTART). Locks with
#  hyprunity's own built-in lock, because hyprlock is not installed here.
#
#  Note: `hyprctl dispatch dpms off` no longer parses — this Hyprland is
#  driven by a Lua config, so dispatchers have to be written in Lua.
# =====================================================================

general {
    # hyprunity's built-in PAM lock — the same thing SUPER + L runs.
    lock_cmd         = qs ipc -c hyprunity call shell lock
    # Lock first, then let the machine sleep.
    before_sleep_cmd = qs ipc -c hyprunity call shell lock
    # Bring the panel back when it wakes.
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 2.5 minutes — dim the panel (and remember the old level).
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 minutes — lock the session.
listener {
    timeout    = 300
    on-timeout = qs ipc -c hyprunity call shell lock
}

# 5.5 minutes — panel off.
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 minutes — suspend.
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
